name: pipeline

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "transcribe = solo ASR | build = composicion + render"
        default: "build"
        type: choice
        options: ["transcribe", "build"]
      asr_model:
        description: "Modelo faster-whisper (tiny/base/small/medium/large-v3)"
        default: "small"
        type: string
      quality:
        description: "Calidad de render"
        default: "delivery"
        type: choice
        options: ["draft", "standard", "delivery"]

jobs:
  work:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # FFmpeg estático cacheado (evita apt-get, ~1-2 min menos)
      - name: Cache FFmpeg estático
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: ~/ffmpeg-static
          key: ffmpeg-static-amd64-v1
      - name: FFmpeg
        run: |
          if [ ! -f ~/ffmpeg-static/ffmpeg ]; then
            mkdir -p ~/ffmpeg-static
            curl -fsSL -o /tmp/ffmpeg.tar.xz https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz
            tar -xf /tmp/ffmpeg.tar.xz -C /tmp
            cp /tmp/ffmpeg-*-amd64-static/ffmpeg /tmp/ffmpeg-*-amd64-static/ffprobe ~/ffmpeg-static/
          fi
          echo "$HOME/ffmpeg-static" >> "$GITHUB_PATH"
          ffmpeg -version | head -n 1

      - name: Dependencias Python
        run: pip install --quiet faster-whisper numpy soundfile

      # ---------- ASR (siempre: alimenta los subtitulos) ----------
      - name: Transcribir
        env:
          ASR_MODEL: ${{ github.event.inputs.asr_model }}
          ASR_LANG: es
          ASR_THREADS: "4"
        run: |
          if [ -f video-1/assets/transcript_full.json ]; then
            echo "El transcript ya esta en el repo; se reutiliza."
          else
            python tools/transcribe_cloud.py
          fi

      # ---------- Composicion + render ----------
      - name: Dependencias de render
        if: ${{ github.event.inputs.mode == 'build' }}
        working-directory: video-1
        run: npm install --no-audit --no-fund

      - name: Materiales del video
        if: ${{ github.event.inputs.mode == 'build' }}
        env:
          HF_SRC: video-1/assets/output_base.mp4
        run: |
          python tools/make_music_np.py
          python tools/gen_pro.py
          python tools/prep_clip.py

      - name: Lint
        if: ${{ github.event.inputs.mode == 'build' }}
        working-directory: video-1
        run: npx --yes hyperframes@0.8.145 lint

      - name: Render
        if: ${{ github.event.inputs.mode == 'build' }}
        working-directory: video-1
        env:
          HYPERFRAMES_TELEMETRY: "0"
        run: |
          mkdir -p renders
          npx --yes hyperframes@0.8.145 render \
            --quality "${{ github.event.inputs.quality }}" \
            --fps 30 --workers 4 \
            --output renders/video-final.mp4
          ls -la renders

      - name: Subir video
        if: ${{ github.event.inputs.mode == 'build' }}
        uses: actions/upload-artifact@v4
        with:
          name: video-final
          path: video-1/renders/video-final.mp4
          if-no-files-found: error
          retention-days: 30

      - name: Subir transcript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transcript
          path: |
            video-1/assets/transcript_full.json
            video-1/assets/transcript_full.txt
          if-no-files-found: ignore
          retention-days: 30

      - name: Subir snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snapshots
          path: video-1/snapshots/**
          if-no-files-found: ignore
          retention-days: 14
